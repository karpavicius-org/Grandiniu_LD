name: Promote verified LD2 source (one-time)
on:
  push:
    branches: [work/ld2-2-native-mouse-full-20261020]
    paths: [.github/workflows/ld2-promote.yml]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Guard real LD2 mouse and all-platform HTML grading evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          def api(path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "User-Agent":"LD2-verified-source-promotion"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return json.load(response)
          r=api("/actions/runs/39432015439")
          assert r["status"]=="completed" and r["conclusion"]=="success",("mouse",r["status"],r["conclusion"])
          print("PASS: Windows/Linux genuine OS mouse",r["id"])
          for rid,stepname in [(39432601100,"Scilab to C++ to HTML to folder grading"),
                               (39432601101,"Scilab native integration and real reports")]:
              jobs=api("/actions/runs/"+str(rid)+"/jobs?per_page=100")["jobs"]
              assert len(jobs)==2,(rid,len(jobs))
              for j in jobs:
                  matches=[s for s in j["steps"] if s["name"]==stepname]
                  assert len(matches)==1 and matches[0]["status"]=="completed" and matches[0]["conclusion"]=="success",(rid,j["name"],matches)
                  print("PASS: four-platform Scilab HTML/C++",rid,j["name"])
          PY
      - name: Restore the SHA-256 verified LD2 source
        run: python tools/ci_ld2_integrate.py
      - name: Stage tested LD2 sources only; GitHub connector will clean workflow files
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          # The originally tested Scilab source has an unused blank final line.
          # Canonicalize the final newline instead of disabling Git's whitespace gate.
          gui=Path("studentui/LD2/ld2_gui.sci")
          data=gui.read_bytes()
          assert data.endswith(bytes([10,10])),"Unexpected end of LD2 GUI source"
          gui.write_bytes(data.rstrip(bytes([10]))+bytes([10]))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A studentui/LD2/ studentui/README.md studentui/bench_report.sci
          git rm -r .ci/ld2_delta tools/ci_ld2_integrate.py
          git rm -f studentui/LD2/LD2_SELFTEST_LAST.txt
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(ld2): commit verified ten-stage Scilab source; remove temporary migration data'
          git push origin HEAD:refs/heads/work/ld2-2-native-mouse-full-20261020
