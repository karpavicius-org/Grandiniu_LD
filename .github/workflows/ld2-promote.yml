name: Promote verified LD2 source (one-time)
on:
  push:
    branches: [work/ld2-2-native-mouse-full-20261020]
    paths: [.github/workflows/ld2-promote.yml]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Guard real LD2 mouse and all-platform HTML grading evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          def api(path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "User-Agent":"LD2-verified-source-promotion"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return json.load(response)
          r=api("/actions/runs/39432015439")
          assert r["status"]=="completed" and r["conclusion"]=="success",("mouse",r["status"],r["conclusion"])
          print("PASS: Windows/Linux genuine OS mouse",r["id"])
          for rid,stepname in [(39432601100,"Scilab to C++ to HTML to folder grading"),
                               (39432601101,"Scilab native integration and real reports")]:
              jobs=api("/actions/runs/"+str(rid)+"/jobs?per_page=100")["jobs"]
              assert len(jobs)==2,(rid,len(jobs))
              for j in jobs:
                  matches=[s for s in j["steps"] if s["name"]==stepname]
                  assert len(matches)==1 and matches[0]["status"]=="completed" and matches[0]["conclusion"]=="success",(rid,j["name"],matches)
                  print("PASS: four-platform Scilab HTML/C++",rid,j["name"])
          PY
      - name: Restore the SHA-256 verified LD2 source
        run: python tools/ci_ld2_integrate.py
      - name: Stage native sources and permanently remove temporary migration data
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          snippet='      - name: Restore verified LD2-2 student source (SHA-256 checked)\n        run: python tools/ci_ld2_integrate.py\n'
          for name in ["ld2-real-input.yml","native.yml","macos.yml"]:
              p=Path(".github/workflows")/name
              source=p.read_text(encoding="utf-8")
              assert source.count(snippet)==1,name
              p.write_text(source.replace(snippet,""),encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A studentui/LD2/ studentui/README.md studentui/bench_report.sci
          git add .github/workflows/ld2-real-input.yml .github/workflows/native.yml .github/workflows/macos.yml
          git rm -r .ci/ld2_delta tools/ci_ld2_integrate.py
          git rm -f studentui/LD2/LD2_SELFTEST_LAST.txt
          git rm .github/workflows/ld2-promote.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(ld2): promote verified ten-stage Scilab source without temporary migration artifacts'
          git push origin HEAD:refs/heads/work/ld2-2-native-mouse-full-20261020
