name: Windows and Linux acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, windows, linux]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-2022"]' || inputs.platform == 'linux' && '["ubuntu-22.04"]' || '["ubuntu-22.04","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch locked dependencies
        run: python tools/fetch_core_deps.py "${{ runner.temp }}/ld-deps"
      - name: Configure
        run: cmake -S core -B build -DLD_DEPS="${{ runner.temp }}/ld-deps" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Complete reports and adversarial imports
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install binaries into portable package
        run: cmake --install build --config Release --prefix studentui
      - name: Install Scilab on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://www.scilab.org/download/2026.1.0/scilab-2026.1.0.bin.x86_64-linux-gnu.tar.xz -o "$RUNNER_TEMP/scilab.tar.xz"
          tar -xJf "$RUNNER_TEMP/scilab.tar.xz" -C "$RUNNER_TEMP"
          echo "SCILAB_BIN=$RUNNER_TEMP/scilab-2026.1.0/bin/scilab" >> "$GITHUB_ENV"
      - name: Install Scilab on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'scilab.exe'
          Invoke-WebRequest https://www.scilab.org/download/2026.1.0/scilab-2026.1.0.bin.x64.exe -OutFile $installer
          $target = Join-Path $env:RUNNER_TEMP 'Scilab'
          $p = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Scilab installer exit $($p.ExitCode)" }
          "SCILAB_BIN=$target\bin\Scilex.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Scilab to C++ to HTML to folder grading
        run: python tools/test_automatic_reports.py --scilab "${{ env.SCILAB_BIN }}" --runtime studentui
      - name: Actual Windows LD4 interface
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_ld4.py --scilab "$env:SCILAB_BIN" --checker build/Release/layoutcheck.exe --output "$env:RUNNER_TEMP/ld4-ui"
      - name: Actual Windows LD5 interface and grading
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_ld5.py --scilab "$env:SCILAB_BIN" --checker build/Release/layoutcheck.exe --grader build/Release/ldcheck.exe --output "$env:RUNNER_TEMP/ld5-ui"
      - name: Actual Linux LD6 interface and grading
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils python3-gi gir1.2-gtk-3.0
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld6.py --scilab "$SCILAB_BIN" --checker build/layoutcheck --grader build/ldcheck --output "$RUNNER_TEMP/ld6-ui"
      - name: Actual Windows LD6 interface and grading
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_ld6.py --scilab "$env:SCILAB_BIN" --checker build/Release/layoutcheck.exe --grader build/Release/ldcheck.exe --output "$env:RUNNER_TEMP/ld6-ui"
      - name: Actual Linux LD7 interface and grading
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils python3-gi gir1.2-gtk-3.0
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld7.py --scilab "$SCILAB_BIN" --checker build/layoutcheck --grader build/ldcheck --output "$RUNNER_TEMP/ld7-ui"
      - name: Actual Windows LD7 interface and grading
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_ld7.py --scilab "$env:SCILAB_BIN" --checker build/Release/layoutcheck.exe --grader build/Release/ldcheck.exe --output "$env:RUNNER_TEMP/ld7-ui"
      - name: Actual Linux LD8 interface and grading
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils python3-gi gir1.2-gtk-3.0
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld8.py --scilab "$SCILAB_BIN" --checker build/layoutcheck --grader build/ldcheck --output "$RUNNER_TEMP/ld8-ui"
      - name: Actual Windows LD8 interface and grading
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_ld8.py --scilab "$env:SCILAB_BIN" --checker build/Release/layoutcheck.exe --grader build/Release/ldcheck.exe --output "$env:RUNNER_TEMP/ld8-ui"
      - name: Actual Linux LD9 interface and grading
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils python3-gi gir1.2-gtk-3.0
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld9.py --scilab "$SCILAB_BIN" --checker build/layoutcheck --grader build/ldcheck --output "$RUNNER_TEMP/ld9-ui"
      - name: Actual Windows LD9 interface and grading
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_ld9.py --scilab "$env:SCILAB_BIN" --checker build/Release/layoutcheck.exe --grader build/Release/ldcheck.exe --output "$env:RUNNER_TEMP/ld9-ui"
      - name: Actual Linux LD10 interface and grading
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils python3-gi gir1.2-gtk-3.0
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld10.py --scilab "$SCILAB_BIN" --checker build/layoutcheck --grader build/ldcheck --output "$RUNNER_TEMP/ld10-ui"
      - name: Actual Windows LD10 interface and grading
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_ld10.py --scilab "$env:SCILAB_BIN" --checker build/Release/layoutcheck.exe --grader build/Release/ldcheck.exe --output "$env:RUNNER_TEMP/ld10-ui"
      - name: Actual Linux LD11 interface and grading
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils python3-gi gir1.2-gtk-3.0
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld11.py --scilab "$SCILAB_BIN" --checker build/layoutcheck --grader build/ldcheck --output "$RUNNER_TEMP/ld11-ui"
      - name: Actual Windows LD11 interface and grading
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_ld11.py --scilab "$env:SCILAB_BIN" --checker build/Release/layoutcheck.exe --grader build/Release/ldcheck.exe --output "$env:RUNNER_TEMP/ld11-ui"
      - name: Actual Linux LD12 interface and grading
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils python3-gi gir1.2-gtk-3.0
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld12.py --scilab "$SCILAB_BIN" --checker build/layoutcheck --grader build/ldcheck --output "$RUNNER_TEMP/ld12-ui"
      - name: Actual Windows LD12 interface and grading
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_ld12.py --scilab "$env:SCILAB_BIN" --checker build/Release/layoutcheck.exe --grader build/Release/ldcheck.exe --output "$env:RUNNER_TEMP/ld12-ui"
      - name: Actual Linux LD1 student interface and grading
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld1_student.py --scilab "$SCILAB_BIN" --checker build/layoutcheck --grader build/ldcheck --output "$RUNNER_TEMP/ld1-ui"
      - name: Actual Windows LD1 student interface and grading
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_ld1_student.py --scilab "$env:SCILAB_BIN" --checker build/Release/layoutcheck.exe --grader build/Release/ldcheck.exe --output "$env:RUNNER_TEMP/ld1-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD1-student-interface-${{ runner.os }}
          path: |
            ${{ runner.temp }}/ld1-ui/*.log
            ${{ runner.temp }}/ld1-ui/*.tsv
            ${{ runner.temp }}/ld1-ui/*.png
            ${{ runner.temp }}/ld1-ui/acceptance.json
      - name: Student delivery on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_student_delivery.py --scilab "$SCILAB_BIN" --grader build/ldcheck --output "$RUNNER_TEMP/delivery"
      - name: Student delivery on Windows
        if: runner.os == 'Windows'
        run: python tools/test_student_delivery.py --scilab "${{ env.SCILAB_BIN }}" --grader build/Release/ldcheck.exe --output "${{ runner.temp }}/delivery"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Student-delivery-${{ runner.os }}
          path: |
            ${{ runner.temp }}/delivery/*.log
            ${{ runner.temp }}/delivery/*.json
      - name: Existing Linux bench geometry
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld5.py --scilab "$SCILAB_BIN" --checker build/layoutcheck --grader build/ldcheck --output "$RUNNER_TEMP/ld5-ui"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld4.py --scilab "$SCILAB_BIN" --checker build/layoutcheck --output "$RUNNER_TEMP/ld4-ui"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ergonomics.py --scilab "$SCILAB_BIN" --output "$RUNNER_TEMP/ld-ergonomics"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: LD-geometry-Linux
          path: |
            ${{ runner.temp }}/ld-ergonomics/*.log
            ${{ runner.temp }}/ld-ergonomics/*.tsv
            ${{ runner.temp }}/ld-ergonomics/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD4-interface-${{ runner.os }}
          path: |
            ${{ runner.temp }}/ld4-ui/*.log
            ${{ runner.temp }}/ld4-ui/*.tsv
            ${{ runner.temp }}/ld4-ui/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD5-interface-${{ runner.os }}
          path: |
            ${{ runner.temp }}/ld5-ui/*.log
            ${{ runner.temp }}/ld5-ui/*.tsv
            ${{ runner.temp }}/ld5-ui/*.png
            ${{ runner.temp }}/ld5-ui/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD6-interface-${{ runner.os }}
          path: |
            ${{ runner.temp }}/ld6-ui/*.log
            ${{ runner.temp }}/ld6-ui/*.tsv
            ${{ runner.temp }}/ld6-ui/*.png
            ${{ runner.temp }}/ld6-ui/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD7-interface-${{ runner.os }}
          path: |
            ${{ runner.temp }}/ld7-ui/*.log
            ${{ runner.temp }}/ld7-ui/*.tsv
            ${{ runner.temp }}/ld7-ui/*.png
            ${{ runner.temp }}/ld7-ui/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD8-interface-${{ runner.os }}
          path: |
            ${{ runner.temp }}/ld8-ui/*.log
            ${{ runner.temp }}/ld8-ui/*.tsv
            ${{ runner.temp }}/ld8-ui/*.png
            ${{ runner.temp }}/ld8-ui/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD9-interface-${{ runner.os }}
          path: |
            ${{ runner.temp }}/ld9-ui/*.log
            ${{ runner.temp }}/ld9-ui/*.tsv
            ${{ runner.temp }}/ld9-ui/*.png
            ${{ runner.temp }}/ld9-ui/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD10-interface-${{ runner.os }}
          path: |
            ${{ runner.temp }}/ld10-ui/*.log
            ${{ runner.temp }}/ld10-ui/*.tsv
            ${{ runner.temp }}/ld10-ui/*.png
            ${{ runner.temp }}/ld10-ui/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD11-interface-${{ runner.os }}
          path: |
            ${{ runner.temp }}/ld11-ui/*.log
            ${{ runner.temp }}/ld11-ui/*.tsv
            ${{ runner.temp }}/ld11-ui/*.png
            ${{ runner.temp }}/ld11-ui/acceptance.json
      - uses: actions/upload-artifact@v4
