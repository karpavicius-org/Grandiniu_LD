name: LD12 Student Workflow and Native Input
on:
  push:
    paths:
      - 'core/src/**'
      - 'studentui/student_profile.sci'
      - 'studentui/bench_session.sci'
      - 'studentui/bench_report.sci'
      - 'core/tests/test_ld12_grading.py'
      - 'tools/check_ld12_routes.py'
      - 'tools/test_ld12_headless.sce'
      - 'tools/test_ld12_native.py'
      - 'tools/test_ld12_native.sce'
      - '.github/workflows/ld12-real-input.yml'
      - 'studentui/LD12/**'
      - 'tools/test_ld12.py'
      - 'tools/test_ld12.sce'
      - 'studentui/tests/workflows.sci'
      - 'studentui/student_style.sci'
      - 'studentui/bench_common.sci'
  pull_request:
    paths:
      - 'core/src/**'
      - 'studentui/student_profile.sci'
      - 'studentui/bench_session.sci'
      - 'studentui/bench_report.sci'
      - 'core/tests/test_ld12_grading.py'
      - 'tools/check_ld12_routes.py'
      - 'tools/test_ld12_headless.sce'
      - 'tools/test_ld12_native.py'
      - 'tools/test_ld12_native.sce'
      - '.github/workflows/ld12-real-input.yml'
      - 'studentui/LD12/**'
      - 'tools/test_ld12.py'
      - 'tools/test_ld12.sce'
      - 'studentui/tests/workflows.sci'
      - 'studentui/student_style.sci'
      - 'studentui/bench_common.sci'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-native-input:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python native-input driver syntax
        run: python -m py_compile tools/test_ld12_native.py
      - name: Fetch locked native dependencies
        run: python tools/fetch_core_deps.py "${{ runner.temp }}/ld-deps"
      - name: Build original C++ measurement and grading engine
        run: |
          cmake -S core -B build -DLD_DEPS="${{ runner.temp }}/ld-deps" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 2
          cmake --install build --config Release --prefix studentui
      - name: Existing C++ core and grading regression
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install Linux Scilab 2026.1 and X11 event/capture tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://www.scilab.org/download/2026.1.0/scilab-2026.1.0.bin.x86_64-linux-gnu.tar.xz -o "$RUNNER_TEMP/scilab.tar.xz"
          tar -xJf "$RUNNER_TEMP/scilab.tar.xz" -C "$RUNNER_TEMP"
          echo "SCILAB_BIN=$RUNNER_TEMP/scilab-2026.1.0/bin/scilab" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils python3-gi gir1.2-gtk-3.0
      - name: Install Windows native desktop and screen-capture packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pywin32 Pillow
      - name: Install Windows Scilab 2026.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer=Join-Path $env:RUNNER_TEMP 'scilab.exe'
          Invoke-WebRequest https://www.scilab.org/download/2026.1.0/scilab-2026.1.0.bin.x64.exe -OutFile $installer
          $target=Join-Path $env:RUNNER_TEMP 'Scilab'
          $p=Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$target" -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Scilab installer exit $($p.ExitCode)"}
          "SCILAB_BIN=$target\bin\Scilex.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: All64 complete LD12 workflows with independent phasors (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: '"$SCILAB_BIN" -nwni -nb -f tools/test_ld12_headless.sce'
      - name: All64 complete LD12 workflows with independent phasors (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:SCILAB_BIN" -nb -f tools/test_ld12_headless.sce'
      - name: LD12 functional GUI, persistence and grading boundaries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld12.py --scilab "$SCILAB_BIN" --core studentui/bin/ldcore.so --grader build/ldcheck --checker build/layoutcheck --output "$RUNNER_TEMP/ld12-ui"
      - name: LD12 functional GUI, persistence and grading boundaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/test_ld12.py --scilab "$env:SCILAB_BIN" --core studentui/bin/ldcore.dll --grader build/Release/ldcheck.exe --checker build/Release/layoutcheck.exe --output "$env:RUNNER_TEMP/ld12-ui"
      - name: Complete LD12 stages using Linux OS mouse and keyboard
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld12_native.py \
            --scilab "$SCILAB_BIN" --core studentui/bin/ldcore.so \
            --grader build/ldcheck --checker build/layoutcheck --output "$RUNNER_TEMP/ld12-native"
      - name: Complete LD12 stages using Windows OS mouse and keyboard
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/test_ld12_native.py --scilab "$env:SCILAB_BIN" --core studentui/bin/ldcore.dll --grader build/Release/ldcheck.exe --checker build/Release/layoutcheck.exe --output "$env:RUNNER_TEMP/ld12-native"
      - name: Package the tested student and teacher runtime
        run: python tools/package_native.py --platform "${{ runner.os }}"
      - uses: actions/upload-artifact@v4
        with:
          name: LD12-package-${{ runner.os }}
          path: dist/Grandiniu_LD-${{ runner.os }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD12-complete-native-input-${{ runner.os }}
          path: |
            ${{ runner.temp }}/ld12-ui/*.png
            ${{ runner.temp }}/ld12-ui/*.log
            ${{ runner.temp }}/ld12-ui/*.json
            ${{ runner.temp }}/ld12-ui/*.tsv
            ${{ runner.temp }}/ld12-native/*.png
            ${{ runner.temp }}/ld12-native/*.json
            ${{ runner.temp }}/ld12-native/*.tsv
            ${{ runner.temp }}/ld12-native/*.log
            ${{ runner.temp }}/ld12-native/*.txt
            ${{ runner.temp }}/ld12-native/*/state.json
            ${{ runner.temp }}/ld12-native/*/config.json
            ${{ runner.temp }}/ld12-native/*/actions.json
            ${{ runner.temp }}/ld12-native/*/acceptance.json
            ${{ runner.temp }}/ld12-native/*/geometry*.tsv
            ${{ runner.temp }}/ld12-native/*/geometry*.log
            ${{ runner.temp }}/ld12-native/*/scilab.log
            ${{ runner.temp }}/ld12-native/*/failure.txt
            ${{ runner.temp }}/ld12-native/*/E*.png
            ${{ runner.temp }}/ld12-native/*/graded/*.json
          if-no-files-found: warn

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    # The full Scilab GUI and delivery checks exceed 30 minutes on Intel.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify native C++ core
        run: |
          python tools/fetch_core_deps.py "$RUNNER_TEMP/deps"
          cmake -S core -B build -DLD_DEPS="$RUNNER_TEMP/deps" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix studentui
      - name: Install matching Scilab
        run: |
          curl --fail --location --retry 3 --retry-all-errors "https://www.utc.fr/~mottelet/scilab/download/2026.1.0/scilab-2026.1.0-${{ matrix.arch }}.dmg" -o "$RUNNER_TEMP/scilab.dmg"
          mkdir "$RUNNER_TEMP/scilab-volume"
          hdiutil attach "$RUNNER_TEMP/scilab.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/scilab-volume"
          app=$(find "$RUNNER_TEMP/scilab-volume" -maxdepth 2 -name '*.app' -type d -print -quit)
          test -n "$app"
          ditto "$app" "$RUNNER_TEMP/Scilab.app"
          hdiutil detach "$RUNNER_TEMP/scilab-volume"
          exe=$(find "$RUNNER_TEMP/Scilab.app/Contents" -type f -name scilab -print -quit)
          test -x "$exe"
          echo "SCILAB_BIN=$exe" >> "$GITHUB_ENV"
          dirname "$exe" >> "$GITHUB_PATH"
          find "$RUNNER_TEMP/Scilab.app/Contents" -name scilab-cli-bin -exec dirname {} \; >> "$GITHUB_PATH"
      - name: Scilab native integration and real reports
        run: python tools/test_automatic_reports.py --scilab "$SCILAB_BIN" --runtime studentui
      - name: All64 complete LD12 workflows with independent phasors (macOS)
        run: '"$SCILAB_BIN" -nwni -nb -f tools/test_ld12_headless.sce'
      - name: Actual LD12 windows and grading
        run: python tools/test_ld12.py --scilab "$SCILAB_BIN" --checker build/layoutcheck --grader build/ldcheck --output "$RUNNER_TEMP/ld12-ui"
      - name: Package the tested macOS runtime
        run: python tools/package_native.py --platform "macOS-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: LD12-package-macOS-${{ matrix.arch }}
          path: dist/Grandiniu_LD-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD12-interface-macOS-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/ld12-ui/*.log
            ${{ runner.temp }}/ld12-ui/*.json
            ${{ runner.temp }}/ld12-ui/*.tsv
            ${{ runner.temp }}/ld12-ui/*.png
