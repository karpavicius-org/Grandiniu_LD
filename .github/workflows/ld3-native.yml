name: LD3 Native Desktop Acceptance
on:
  push:
    paths:
      - 'studentui/LD3/**'
      - 'tools/test_ld3_native.*'
      - 'tools/test_ld678_os_input.py'
      - '.github/workflows/ld3-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ld3-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate test Python
        run: python -m py_compile tools/test_ld3_native.py
      - name: Native dependencies
        run: python tools/fetch_core_deps.py "${{ runner.temp }}/ld-deps"
      - name: Build and regression-test unchanged C++ model and graders
        run: |
          cmake -S core -B build -DLD_DEPS="${{ runner.temp }}/ld-deps" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure
          cmake --install build --config Release --prefix studentui
      - name: Linux Scilab and native desktop input
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://www.scilab.org/download/2026.1.0/scilab-2026.1.0.bin.x86_64-linux-gnu.tar.xz -o "$RUNNER_TEMP/scilab.tar.xz"
          tar -xJf "$RUNNER_TEMP/scilab.tar.xz" -C "$RUNNER_TEMP"
          echo "SCILAB_BIN=$RUNNER_TEMP/scilab-2026.1.0/bin/scilab" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils python3-gi gir1.2-gtk-3.0
      - name: Windows desktop input and screenshots
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check pywin32 Pillow
      - name: Windows Scilab
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer=Join-Path $env:RUNNER_TEMP 'scilab.exe'
          Invoke-WebRequest https://www.scilab.org/download/2026.1.0/scilab-2026.1.0.bin.x64.exe -OutFile $installer
          $target=Join-Path $env:RUNNER_TEMP 'Scilab'
          $p=Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$target" -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Scilab installer exit $($p.ExitCode)"}
          "SCILAB_BIN=$target\bin\Scilex.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: LD3 six stages and adverse scenarios - Linux OS mouse/keyboard
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tools/test_ld3_native.py --scilab "$SCILAB_BIN" --core studentui/bin/ldcore.so --grader build/ldcheck --checker build/layoutcheck --output "$RUNNER_TEMP/ld3-native"
      - name: LD3 six stages and adverse scenarios - Windows OS mouse/keyboard
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/test_ld3_native.py --scilab "$env:SCILAB_BIN" --core studentui/bin/ldcore.dll --grader build/Release/ldcheck.exe --checker build/Release/layoutcheck.exe --output "$env:RUNNER_TEMP/ld3-native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LD3-native-${{ runner.os }}
          path: |
            ${{ runner.temp }}/ld3-native/*.json
            ${{ runner.temp }}/ld3-native/*.tsv
            ${{ runner.temp }}/ld3-native/*.log
            ${{ runner.temp }}/ld3-native/*.png
            ${{ runner.temp }}/ld3-native/failure*
            ${{ runner.temp }}/ld3-native/graded/*.json
            ${{ runner.temp }}/ld3-native/synthetic-grades/*.json
            ${{ runner.temp }}/ld3-native/reports/*
          if-no-files-found: warn
